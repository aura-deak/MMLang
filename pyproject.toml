[project]
name = "mmlang"
dynamic = ["version"]
description = "Mobius Machine toolchain - assembler, VM and debugger for an esoteric language"
requires-python = ">=3.8"
dependencies = [
    "bitarray>=3.11.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.scripts]
mmlang-asm = "asm:main"
mmlang-run = "run:main"
mmlang-debug = "debug:main"
mmlang-text2mm = "text2mm:main"

[tool.hatch.version]
source = "vcs"
tag = true

[tool.hatch.build.targets.wheel]
only-include = ["asm.py", "asm_core.py", "common.py", "data_tape_maker.py", "debug.py", "run.py", "text2mm.py", "vm_core.py"]

[tool.uv]
python-preference = "only-system"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
